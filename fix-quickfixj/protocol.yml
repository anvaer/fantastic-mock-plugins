apiVersion: 5
provider: com.fantasticmock.example.fixquickfixj.QuickFixProtocolPlugin

descriptor:
  id: fix-quickfixj
  displayName: FIX
  version: 1.5.0
  capabilities: [CONNECTION_ORIENTED]

runtime:
  settings:
    host: { type: string, default: "127.0.0.1" }
    port: { type: integer, default: 9886, min: 0, max: 65535 }
    # The one version this instance speaks. Run an instance per version to serve both.
    begin-string: { type: string, default: "FIX.4.2", options: ["FIX.4.2", "FIX.4.4"] }
    # The mock's own CompID. Empty accepts any TargetCompID (56) and answers as that CompID.
    sender-comp-id: { type: string }
    max-in-flight: { type: integer, default: 1024, min: 1, max: 1000000 }
    # Answer an application message that matches no template with BusinessMessageReject (35=j).
    reject-unmatched: { type: boolean, default: true }
    # Send a TestRequest to a silent client and disconnect it when that goes unanswered.
    disconnect-idle: { type: boolean, default: true }
    # Keep every sent application message for ResendRequest. Off, a resend is answered with a
    # gap fill and memory stays flat however long a busy session runs.
    persist-messages: { type: boolean, default: true }
    # Validate incoming messages against the data dictionary and reject the invalid ones.
    validate: { type: boolean, default: false }
    # A QuickFIX/J data dictionary file with your own fields and groups. Empty uses the
    # standard dictionary of the version.
    data-dictionary: { type: string }

message:
  request:
    fields:
      # The routing field selects the route-index bucket.
      msgType: { type: string, routing: true, label: "MsgType (35)" }
      senderCompId: { type: string, label: "SenderCompID (49)" }
      targetCompId: { type: string, label: "TargetCompID (56)" }
      # request.tag.<number>; the first occurrence of a repeated tag.
      tag: { type: map, label: Tags }
      # The whole message in wire order, with | in place of SOH. MsgType, the CompIDs and Tags are
      # read from it: in an Example request they change it, and it changes them.
      body: { type: text, raw: true, label: Raw message }

template:
  response:
    fields:
      msgType:
        label: "MsgType (35)"
        description: "For example 8 ExecutionReport, 9 OrderCancelReject, j BusinessMessageReject, 3 Reject"
      tags:
        label: Tags
        type: map
        description: Tag number to value; a tag with an empty value is left out
      body:
        label: Raw fields
        type: text
        description: "tag=value pairs separated by | or line breaks; use it for repeating groups"
  # Unsolicited messages to logged-on sessions.
  callback:
    fields:
      targetCompId:
        label: Target CompID
        description: "Without a server URL: CompID of the client logged on here that receives the message; empty sends it to every logged-on session. With one: the server's CompID"
      msgType:
        label: "MsgType (35)"
      tags:
        label: Tags
        type: map
        description: Tag number to value; a tag with an empty value is left out
      body:
        label: Raw fields
        type: text
        description: "tag=value pairs separated by | or line breaks; use it for repeating groups"
      # With a url the callback is a FIX client: it sends over the session with that server and its
      # CompIDs, logging on first when there is none.
      url:
        label: Server URL
        type: string
        group: Connect as client
        description: "fix://host:port of a FIX server: the callback sends over the session this side has with it under the same CompIDs, and logs on as a client first when there is none. Empty sends to the clients logged on to this endpoint"
      senderCompId:
        label: Sender CompID
        type: string
        group: Connect as client
        description: This side's CompID in the session with the server; empty uses the endpoint's sender-comp-id
      logonTags:
        label: Logon tags
        type: map
        group: Connect as client
        description: "More fields of the Logon (35=A) by tag number, such as 553 Username and 554 Password; 108 sets HeartBtInt (30 by default). Used by the callback that logs on"
      keepSessionMs:
        label: Keep session (ms)
        type: integer
        default: 30000
        group: Connect as client
        description: How long a session no callback is using stays logged on for the next callback with the same server and CompIDs; 0 logs out as soon as the last callback is over
      # A reply is an application message a session sends back while the callback waits: it
      # goes to the callback, not to the templates. Each default is what the plugin uses when a
      # template leaves the field out; the editor shows it in the empty field.
      awaitReplies:
        label: Replies to wait for
        type: integer
        default: 0
        description: Replies each session the message went to must send before the callback is over; with a reply pattern, only messages it matches count. 0 waits for none
      replyPattern:
        label: Reply pattern
        type: string
        description: "Regular expression found in a reply's text, with | between fields, such as \\|35=S\\|; set alone, the callback waits for one such reply. From clients logged on here, other messages go to the templates as usual"
      timeoutMs:
        label: Reply timeout (ms)
        type: integer
        default: 10000
        description: Longest wait for the replies, counted from when the message was sent, and with a server URL also for the Logon; fewer replies by then fail the callback
